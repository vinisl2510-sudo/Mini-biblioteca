<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Meu Perfil - Mini Biblioteca</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="page">
  <a th:href="@{/livros}">← Voltar para livros</a>
  <h1>Meu Perfil</h1>

  <p><strong>Nome:</strong> <span th:text="${usuario.nome}"></span></p>
  <p><strong>E-mail:</strong> <span th:text="${usuario.email}"></span></p>

  <h2>Trocar senha</h2>

  <p th:if="${sucesso}" th:text="${sucesso}" style="color: green;"></p>
  <p th:if="${erro}" th:text="${erro}" class="mensagem-erro"></p>

  <form th:action="@{/perfil/senha}" method="post">
    <label for="senhaAtual">Senha atual</label>
    <input type="password" id="senhaAtual" name="senhaAtual" required>

    <label for="novaSenha">Nova senha</label>
    <input type="password" id="novaSenha" name="novaSenha" required minlength="6">

    <button type="submit">Alterar senha</button>
  </form>
</div>

<script th:src="@{/js/tema.js}"></script>
</body>
</html>
