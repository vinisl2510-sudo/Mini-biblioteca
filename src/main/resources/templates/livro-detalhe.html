<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title th:text="${livro.titulo}">Livro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="page">
  <a th:href="@{/livros}">← Voltar</a>

  <img th:if="${livro.imagemUrl}" th:src="${livro.imagemUrl}" alt="Capa do livro" class="capa-detalhe">
  <div th:unless="${livro.imagemUrl}" class="capa-placeholder capa-placeholder-grande">📖</div>

  <span class="categoria-tag" th:if="${livro.categoria}" th:text="${livro.categoria}"></span>
  <h1 th:text="${livro.titulo}"></h1>
  <p th:text="'por ' + ${livro.autor}"></p>
  <p class="dado" th:text="${'R$ ' + livro.preco}"></p>
  <p th:text="${livro.descricao}"></p>
  <p class="dado" th:text="'Estoque: ' + ${livro.estoque}"></p>

  <p th:if="${erro}" th:text="${erro}" class="mensagem-erro"></p>

  <div sec:authorize="isAuthenticated()">
    <form th:action="@{/favoritos/{id}(id=${livro.id})}" method="post" style="display: inline;">
      <button type="submit" th:text="${favoritado} ? 'Remover dos favoritos' : 'Favoritar'"></button>
    </form>

    <form th:if="${livro.estoque > 0}" th:action="@{/compras/{id}(id=${livro.id})}" method="post" style="display: inline;">
      <label for="quantidade">Qtd.</label>
      <input type="number" id="quantidade" name="quantidade" value="1" min="1" th:max="${livro.estoque}" style="width: 70px; display: inline-block;">
      <button type="submit">Comprar</button>
    </form>
    <span th:if="${livro.estoque == 0}">Esgotado</span>
    <span th:if="${comprado}"> · Você já comprou este livro antes</span>
  </div>

  <div sec:authorize="!isAuthenticated()">
    <a th:href="@{/login}">Entre para favoritar ou comprar</a>
  </div>

  <h2>Avaliações</h2>

  <p th:if="${mediaNota != null}" th:text="'⭐ Média: ' + ${#numbers.formatDecimal(mediaNota, 1, 1)} + ' / 5'"></p>
  <p th:if="${mediaNota == null}">Este livro ainda não tem avaliações.</p>

  <p th:if="${erroAvaliacao}" th:text="${erroAvaliacao}" class="mensagem-erro"></p>

  <div sec:authorize="isAuthenticated()">
    <form th:action="@{/livros/{id}/avaliar(id=${livro.id})}" method="post">
      <label for="nota">Sua nota</label>
      <select id="nota" name="nota">
        <option value="5">5 - Excelente</option>
        <option value="4">4 - Muito bom</option>
        <option value="3">3 - Bom</option>
        <option value="2">2 - Ruim</option>
        <option value="1">1 - Muito ruim</option>
      </select>

      <label for="comentario">Comentário</label>
      <textarea id="comentario" name="comentario"></textarea>

      <button type="submit">Enviar avaliação</button>
    </form>
  </div>

  <div th:each="avaliacao : ${avaliacoes}" class="card-livro">
    <p><strong th:text="${avaliacao.usuario.nome}"></strong> — <span th:text="'⭐ ' + ${avaliacao.nota}"></span></p>
    <p th:text="${avaliacao.comentario}"></p>
  </div>
</div>
<script th:src="@{/js/tema.js}"></script>
</body>
</html>
