<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Formulário de Livro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="page">
    <a th:href="@{/admin/livros}">← Voltar</a>
    <h1 th:text="${livro.id} != null ? 'Editar Livro' : 'Novo Livro'"></h1>

    <form th:action="${livro.id} != null ? @{/admin/livros/{id}(id=${livro.id})} : @{/admin/livros}" method="post">
        <label>Título</label>
        <input type="text" name="titulo" th:value="${livro.titulo}">

        <label>Autor</label>
        <input type="text" name="autor" th:value="${livro.autor}">

        <label>Descrição</label>
        <textarea name="descricao" th:text="${livro.descricao}"></textarea>

        <label>Preço</label>
        <input type="number" step="0.01" name="preco" th:value="${livro.preco}">

        <label>Categoria</label>
        <input type="text" name="categoria" th:value="${livro.categoria}">

        <label>Estoque</label>
        <input type="number" name="estoque" th:value="${livro.estoque}">

        <label>URL da capa (opcional)</label>
        <input type="url" name="imagemUrl" th:value="${livro.imagemUrl}" placeholder="https://...">

        <button type="submit">Salvar</button>
    </form>
</div>
<script th:src="@{/js/tema.js}"></script>
</body>
</html>
