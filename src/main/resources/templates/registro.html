<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Criar conta - Mini Biblioteca</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="page">
    <h2>Criar conta</h2>

    <p th:if="${erro}" th:text="${erro}" class="mensagem-erro"></p>

    <form th:action="@{/registro}" th:object="${registroDTO}" method="post">
        <label for="nome">Nome</label>
        <input type="text" id="nome" th:field="*{nome}">
        <div th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>

        <label for="email">E-mail</label>
        <input type="email" id="email" th:field="*{email}">
        <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

        <label for="senha">Senha</label>
        <input type="password" id="senha" th:field="*{senha}">
        <div th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></div>

        <button type="submit">Criar conta</button>
    </form>

    <p>Já tem conta? <a th:href="@{/login}">Entrar</a></p>
</div>
<script th:src="@{/js/tema.js}"></script>
</body>
</html>
