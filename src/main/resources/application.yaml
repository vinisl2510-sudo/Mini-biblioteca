spring:
  application:
    name: mini-biblioteca

  # Credenciais vêm de variáveis de ambiente (carregadas do .env),
  # nunca ficam hardcoded aqui.
  datasource:
    url: jdbc:mysql://localhost:3306/${DB_NAME}?useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  thymeleaf:
    cache: false

server:
  port: ${SERVER_PORT:8080}

app:
  security:
    remember-me-key: ${REMEMBER_ME_KEY}